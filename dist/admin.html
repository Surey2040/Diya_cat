<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diya Closet — Your collection</title><style>
:root{--p:#4b315c;--ink:#382740;--muted:#96879e;--line:#e6ddeb;--bg:#faf8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b99bca;outline-offset:3px}header{background:var(--p);padding:22px 6%;display:flex;align-items:center;justify-content:space-between;gap:15px}header img{width:143px;height:65px;object-fit:contain}header button{background:#ffffff14;border:1px solid #ffffff35;color:white;padding:12px 17px;border-radius:30px}main{max-width:1300px;padding:43px 5%;margin:auto}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#a88ab8}h1{font:46px Georgia,serif;margin:10px 0}h2{font:29px Georgia,serif;margin:5px 0 12px}p{line-height:1.7;color:var(--muted)}.primary{background:var(--p);color:white;border:0;border-radius:10px;padding:13px 19px}.ghost{background:white;border:1px solid var(--line);border-radius:10px;padding:11px 15px;color:var(--p)}.stall{border:1px solid #e0d2e7;border-radius:18px;display:flex;gap:24px;align-items:center;padding:25px 29px;background:linear-gradient(110deg,#f0e7f5,#fcfafd);margin-bottom:31px}.pin{width:48px;height:48px;background:#e3d5eb;border-radius:50%;display:grid;place-items:center;font-size:23px;flex-shrink:0}.stall h2{font-size:25px;margin:6px 0}.stall p{margin:3px 0}.stall button,.stall a{margin-left:auto;white-space:nowrap}.map{color:var(--p)}.tools{display:flex;gap:12px;align-items:center;margin:0 0 24px}.tools input{flex:1;background:white;border:1px solid var(--line);padding:14px 16px;border-radius:10px;min-width:0}.count{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{background:white;border-radius:14px;overflow:hidden;border:1px solid #eee7f1}.visual{width:100%;aspect-ratio:.85;background:#f0e9f4;display:grid;place-items:center;border:0;position:relative}.visual img{width:90%;height:90%;object-fit:contain}.code{position:absolute;top:12px;left:12px;color:#9579a4;font-size:10px;letter-spacing:1px}.info{padding:17px}.cat{font-size:9px;letter-spacing:1.4px;color:#ab91b8;text-transform:uppercase}.info h3{font:20px Georgia,serif;margin:9px 0}.price{font-size:13px;color:var(--p)}.actions{display:flex;gap:7px;border-top:1px solid #f0eaf3;margin-top:16px;padding-top:12px}.actions button{border:0;color:var(--p);background:#f6f1f8;border-radius:7px;padding:8px 11px;font-size:11px}.actions .del{background:none;color:#a46e7f;margin-left:auto}.note{font-size:11px;margin-top:30px}.empty{grid-column:1/-1;padding:45px;text-align:center;color:var(--muted)}dialog{width:min(650px,94vw);border:0;border-radius:20px;padding:27px;color:var(--ink);max-height:90vh;box-shadow:0 20px 100px #2a143a33}dialog::backdrop{background:#2e183c65;backdrop-filter:blur(4px)}.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.dh h2{margin:0}.close{border:0;border-radius:50%;width:32px;height:32px;font-size:22px;background:#f3edf7;color:var(--p)}form label{display:block;color:#876993;font-size:11px;margin:15px 0 7px}form input,form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fcfafd;color:var(--ink)}textarea{min-height:85px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.upload{display:flex;align-items:center;gap:20px;background:#f4edf8;border-radius:12px;padding:15px}.upload img{width:83px;height:108px;object-fit:contain}.upload input{background:none;padding:7px;font-size:12px}.detailimg{width:100%;height:370px;object-fit:contain;background:#f2ebf6;border-radius:15px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#eee3f5;border-radius:7px;padding:7px 10px;font-size:11px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:white;border-radius:10px;padding:13px 22px;z-index:9;max-width:95vw}#toast:empty{display:none}.publish{display:flex;align-items:center;gap:10px;margin-top:20px}.publish input{width:18px;height:18px}.publish label{margin:0}a{color:var(--p)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){main{padding:28px 18px}header{padding:16px 20px}header img{width:112px;height:50px}h1{font-size:35px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.info{padding:12px}.info h3{font-size:18px}.stall{padding:19px;gap:12px;flex-wrap:wrap}.stall button{margin-left:60px}.pin{width:40px;height:40px}.stall h2{font-size:23px}.intro{gap:12px}.intro .primary{font-size:12px;padding:12px}.actions button{padding:7px 8px}.count{font-size:10px}.row{gap:10px}.detailimg{height:290px}}
</style></head><body><section id="loginBox" style="max-width:420px;margin:60px auto;padding:25px"><img src="assets/diya-logo.png" alt="Diya Closet" style="width:150px;background:#4b315c;border-radius:10px;padding:12px"><h1>Your studio</h1><form id="loginForm"><label for="email">Admin email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><p id="loginError" role="status"></p><button class="primary" id="loginSubmit">Sign in</button> <button class="ghost" id="resetPassword" type="button">Reset password</button></form></section><div id="app" hidden><header><img src="assets/diya-logo.png" alt="Diya Closet"><button id="logout" class="ghost">Log out</button><button id="switch">View catalogue ↗</button></header><main><div class="intro"><div><span class="eyebrow" id="eyebrow">DIYA CLOSET · ADMIN</span><h1>Your collection</h1></div><button class="primary" id="add">＋ Add dress</button></div><section id="stall" class="stall"></section><div class="tools"><input id="search" placeholder="Search your collection…" aria-label="Search dresses"><span class="count" id="count"></span></div><div class="grid" id="grid"></div><p class="note">Dress and stall updates are saved to your shared catalogue.</p></main></div>
<dialog id="edit"><div class="dh"><h2 id="editTitle">Edit dress</h2><button class="close" data-close="edit" aria-label="Close">×</button></div><form id="dressForm"><div class="upload"><img id="photo" alt="Dress photo"><div><label for="upload">Dress photo</label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG or WebP · up to 10 MB</small></div></div><label for="name">Dress name *</label><input id="name" required maxlength="80"><div class="row"><div><label for="code">Product code *</label><input id="code" required maxlength="25"></div><div><label for="price">Price (₹) *</label><input id="price" type="number" required min="1" step="1"></div></div><div class="row"><div><label for="category">Category *</label><input id="category" required maxlength="60"></div><div><label for="fabric">Fabric *</label><input id="fabric" required maxlength="80"></div></div><label for="sizes">Sizes (comma separated, optional)</label><input id="sizes" placeholder="S, M, L, XL" maxlength="80"><label for="description">Description</label><textarea id="description" maxlength="1200"></textarea><div class="foot"><button type="button" class="ghost" data-close="edit">Cancel</button><button class="primary" id="saveDress">Save dress</button></div></form></dialog>
<dialog id="stallEdit"><div class="dh"><h2>Your next stall</h2><button class="close" data-close="stallEdit" aria-label="Close">×</button></div><p>Let customers know where they can visit you next.</p><form id="stallForm"><label for="eventName">Stall / event name *</label><input id="eventName" required maxlength="100" placeholder="e.g. Weekend fashion pop-up"><label for="venue">Venue / place *</label><input id="venue" required maxlength="120" placeholder="Hall or shopping centre name"><label for="address">Full address *</label><input id="address" required maxlength="250" placeholder="Street, area and city"><div class="row"><div><label for="startDate">Start date *</label><input id="startDate" type="date" required></div><div><label for="endDate">End date (optional)</label><input id="endDate" type="date"></div></div><div class="row"><div><label for="startTime">Opening time *</label><input id="startTime" type="time" required></div><div><label for="endTime">Closing time *</label><input id="endTime" type="time" required></div></div><label for="mapUrl">Google Maps link (optional)</label><input id="mapUrl" type="url" placeholder="https://maps.google.com/…"><div class="publish"><input type="checkbox" id="published" checked><label for="published">Show this stall in the customer catalogue</label></div><div class="foot"><button type="button" class="ghost" data-close="stallEdit">Cancel</button><button class="primary">Save stall update</button></div></form></dialog>
<dialog id="view"><div class="dh"><h2>Dress details</h2><button class="close" data-close="view" aria-label="Close">×</button></div><div id="viewContent"></div></dialog><dialog id="remove"><h2>Delete this dress?</h2><p id="removeText"></p><div class="foot"><button class="ghost" data-close="remove">Keep dress</button><button class="primary" id="deleteConfirm">Delete dress</button></div></dialog><dialog id="passwordReset"><h2>Set your password</h2><form id="newPasswordForm"><label for="newPassword">New password (at least 12 characters)</label><input id="newPassword" type="password" minlength="12" autocomplete="new-password" required><button class="primary">Save password</button></form></dialog><div id="toast" role="status"></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud.js"></script><script>
const original=[];const KEY='diya-linked-studio-demo-v2';const $=s=>document.getElementById(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={products:original,stall:null},publicMode=false,editing=null,photo='',removing=null,timer;
function toast(s){$('toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',4500)}
let busy=false;
async function commit(next){
 if(busy)return false;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{
  if(!(await DiyaCloud.admin()))throw Error('Admin access required. Please sign in again.');
  if(next.stall!==state.stall)await DiyaCloud.saveStall(next.stall);
  else {
   const deleted=state.products.find(p=>!next.products.some(n=>String(n.id)===String(p.id)));
   if(deleted){await DiyaCloud.remove(deleted.id);await DiyaCloud.cleanImage(deleted.image);}
   else {const changed=next.products.find(p=>state.products.find(x=>String(x.id)===String(p.id))!==p);if(changed){const old=state.products.find(x=>String(x.id)===String(changed.id));const saved=await DiyaCloud.saveProduct(changed);if(old&&old.image!==saved.image)await DiyaCloud.cleanImage(old.image);}}
  }
  state=await DiyaCloud.load();render();return true;
 }catch(e){toast(e.message);return false;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}
function niceDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}function clock(s){const [h,m]=s.split(':');return (Number(h)%12||12)+':'+m+' '+(Number(h)>=12?'PM':'AM')}
function renderStall(){const s=state.stall;const eligible=s&&s.published&&(s.endDate||s.startDate)>=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});$('stall').hidden=publicMode&&!eligible;if(publicMode&&!eligible){$('stall').style.display='none';return}$('stall').style.display='flex';$('stall').innerHTML=s?`<div class="pin">⌖</div><div><span class="eyebrow">${publicMode?'OUR NEXT STALL':s.published?'NEXT STALL · PUBLISHED':'NEXT STALL · HIDDEN'}</span><h2>${esc(s.eventName)}</h2><p>${esc(s.venue)} · ${esc(s.address)}</p><p>${niceDate(s.startDate)}${s.endDate?' – '+niceDate(s.endDate):''} &nbsp; ${clock(s.startTime)} – ${clock(s.endTime)}</p></div>${publicMode?(s.mapUrl?`<a class="map" href="${esc(s.mapUrl)}" target="_blank" rel="noopener">Get directions ↗</a>`:''):'<button class="ghost" id="stallButton">Update stall ↗</button>'}`:`<div class="pin">⌖</div><div><span class="eyebrow">MEET YOUR CUSTOMERS</span><h2>Where are we popping up next?</h2><p>Add your next stall’s location and dates.</p></div><button class="ghost" id="stallButton">＋ Add stall</button>`;if($('stallButton'))$('stallButton').onclick=openStall}
function render(){renderStall();$('eyebrow').textContent=publicMode?'DIYA CLOSET · CUSTOMER PREVIEW':'DIYA CLOSET · ADMIN';$('switch').textContent=publicMode?'← Back to admin':'View catalogue ↗';$('add').hidden=publicMode;let q=$('search').value.toLowerCase();let list=state.products.filter(p=>[p.name,p.code,p.fabric,p.category].join(' ').toLowerCase().includes(q));$('count').textContent=list.length+' dresses';$('grid').innerHTML=list.map(p=>`<article class="card"><button class="visual" data-action="view" data-id="${p.id}" aria-label="View ${esc(p.name)}"><img loading="lazy" src="${esc(p.image)}" alt="${esc(p.name)}"><span class="code">${esc(p.code)}</span></button><div class="info"><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3><strong class="price">₹${Number(p.price).toLocaleString('en-IN')}</strong>${publicMode?'':`<div class="actions"><button data-action="edit" data-id="${p.id}">Edit</button><button data-action="view" data-id="${p.id}">View</button><button class="del" data-action="delete" data-id="${p.id}">Delete</button></div>`}</div></article>`).join('')||'<div class="empty">No matching dresses.</div>'}
function openEdit(id){editing=id;const p=state.products.find(x=>String(x.id)===String(id));$('dressForm').reset();for(const k of ['name','code','price','category','fabric','description'])$(k).value=p?.[k]||'';$('sizes').value=p?.sizes||'';photo=p?.image||'';$('photo').src=photo;$('photo').hidden=!photo;$('editTitle').textContent=p?'Edit dress':'Add dress';$('edit').showModal()}
function openStall(){const s=state.stall;$('stallForm').reset();for(const k of ['eventName','venue','address','startDate','endDate','startTime','endTime','mapUrl'])$(k).value=s?.[k]||'';$('published').checked=s?s.published:true;$('stallEdit').showModal()}
$('stallForm').onsubmit=async e=>{e.preventDefault();const s={};for(const k of ['eventName','venue','address','startDate','endDate','startTime','endTime','mapUrl'])s[k]=$(k).value.trim();if(s.endDate&&s.endDate<s.startDate)return toast('End date must be on or after the start date.');if(s.endTime<=s.startTime)return toast('Closing time must be after opening time.');if(s.mapUrl&&!/^https?:\/\//i.test(s.mapUrl))return toast('Use a valid https Maps link.');if(!s.eventName||!s.venue||!s.address)return toast('Enter the event, venue and address.');s.published=$('published').checked;if(await commit({...state,stall:s})){$('stallEdit').close();toast('Stall saved. Open catalogue preview to see it.')}};
$('upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10485760)return toast('Choose a JPG, PNG or WebP photo under 10 MB.');$('saveDress').disabled=true;try{const url=URL.createObjectURL(f);const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});let r=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/webp',.85);URL.revokeObjectURL(url);$('photo').src=photo;$('photo').hidden=false}catch(e){toast('Could not open this image.')}finally{$('saveDress').disabled=false}};
$('dressForm').onsubmit=async e=>{e.preventDefault();if(!photo)return toast('Please add a dress photo.');const p={id:editing||crypto.randomUUID(),image:photo};for(const k of ['name','code','category','fabric','description','sizes'])p[k]=$(k).value.trim();if(!p.name||!p.code||!p.category||!p.fabric)return toast('Fill all required details.');p.price=Number($('price').value);if(state.products.some(x=>String(x.id)!==String(editing)&&x.code.toLowerCase()===p.code.toLowerCase()))return toast('This product code is already used.');const next=editing?state.products.map(x=>String(x.id)===String(editing)?p:x):[p,...state.products];if(await commit({...state,products:next})){$('edit').close();toast('Dress saved in admin and catalogue preview.')}};
$('grid').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const p=state.products.find(x=>String(x.id)===b.dataset.id);if(!p)return;if(b.dataset.action==='edit')openEdit(p.id);if(b.dataset.action==='delete'){removing=p.id;$('removeText').textContent='“'+p.name+'” will be removed from admin and the catalogue.';$('remove').showModal()}if(b.dataset.action==='view'){$('viewContent').innerHTML=`<img class="detailimg" src="${esc(p.image)}" alt="${esc(p.name)}"><p class="eyebrow">${esc(p.code)} · ${esc(p.category)}</p><h2>${esc(p.name)}</h2><strong>₹${Number(p.price).toLocaleString('en-IN')}</strong><p>${esc(p.description)}</p><p>Fabric: ${esc(p.fabric)}</p><div class="chips">${(p.sizes||'').split(',').filter(Boolean).map(s=>`<span class="chip">${esc(s.trim())}</span>`).join('')}</div>`;$('view').showModal()}};
$('deleteConfirm').onclick=async ()=>{if(await commit({...state,products:state.products.filter(x=>x.id!==removing)})){$('remove').close();toast('Dress deleted from catalogue.')}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('switch').onclick=()=>window.open('./','_blank','noopener');$('add').onclick=()=>openEdit(null);$('search').oninput=render;async function boot(){
 try{if(!DiyaCloud.configured)throw Error('One-time setup needed: fill config.js with your Supabase URL and publishable key.');
 if(!(await DiyaCloud.admin())){$('loginError').textContent='Sign in with your approved admin account.';$('loginBox').hidden=false;$('app').hidden=true;return;}
 state=await DiyaCloud.load();$('loginBox').hidden=true;$('app').hidden=false;render();
 }catch(e){$('loginError').textContent=e.message;$('loginBox').hidden=false;$('app').hidden=true;}}
 $('loginForm').onsubmit=async e=>{e.preventDefault();$('loginSubmit').disabled=true;try{if(!DiyaCloud.configured)throw Error('Supabase setup is required first.');const {error}=await DiyaCloud.db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!(await DiyaCloud.admin())){await DiyaCloud.db.auth.signOut();throw Error('This account is not an approved administrator.');}$('password').value='';await boot();}catch(e){$('loginError').textContent=e.message}finally{$('loginSubmit').disabled=false}};
 $('logout').onclick=async()=>{await DiyaCloud.db.auth.signOut();state={products:[],stall:null};$('app').hidden=true;$('loginBox').hidden=false;};
 $('resetPassword').onclick=async()=>{try{if(!DiyaCloud.configured)throw Error('Supabase setup is required first.');const email=$('email').value.trim();if(!email)throw Error('Enter your email address first.');const {error}=await DiyaCloud.db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin.html'});if(error)throw error;$('loginError').textContent='If this account exists, a reset link will be sent.';}catch(e){$('loginError').textContent=e.message}};
 if(DiyaCloud.db)DiyaCloud.db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')$('passwordReset').showModal();if(event==='SIGNED_OUT'){$('app').hidden=true;$('loginBox').hidden=false;}});
 $('newPasswordForm').onsubmit=async e=>{e.preventDefault();const {error}=await DiyaCloud.db.auth.updateUser({password:$('newPassword').value});if(error)return toast(error.message);$('passwordReset').close();$('newPassword').value='';await boot();toast('Password updated.');};
 boot();
</script></body></html>
